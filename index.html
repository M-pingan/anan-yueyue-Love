<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>梦幻 3D 相册 · 双生宇宙</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 开场倒计时帷幕 */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; z-index: 5000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1.5s ease-in-out;
        }
        #countdown-text {
            font-size: 180px; color: transparent;
            -webkit-text-stroke: 3px #ffb6c1;
            text-shadow: 0 0 60px rgba(255,105,180,0.8);
            font-weight: 100; letter-spacing: 10px;
        }
        .heartbeat-anim { animation: heartbeat 1s cubic-bezier(0.4,0,0.2,1) forwards; }
        @keyframes heartbeat {
            0% { transform: scale(0.5); opacity: 0; }
            40% { transform: scale(1.2); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* UI 控制面板 */
        #menu {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; z-index: 100; pointer-events: none;
            opacity: 0; transition: opacity 2s 1s;
        }
        .instruction {
            background: rgba(15,0,25,0.7); backdrop-filter: blur(12px);
            padding: 15px 30px; border-radius: 40px; display: inline-block;
            border: 1px solid rgba(255,105,180,0.4);
            box-shadow: 0 0 25px rgba(255,105,180,0.2); pointer-events: auto;
        }
        .keys { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .key-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 16px; border-radius: 20px; font-size: 13px; color: #ddd;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s; cursor: pointer;
        }
        .key-btn span.num {
            background: rgba(255,255,255,0.2); color: white;
            padding: 2px 8px; border-radius: 50%; font-weight: bold; font-size: 12px;
        }
        #btn-reveal {
            background: rgba(255,105,180,0.1); border: 1px solid #ff69b4;
            box-shadow: 0 0 15px rgba(255,105,180,0.4);
        }
        #btn-reveal span.num {
            background: linear-gradient(135deg, #ff69b4, #8a2be2);
            box-shadow: 0 0 10px rgba(255,105,180,0.8);
        }
        .mouse-hint { margin-top: 12px; font-size: 12px; color: #888; letter-spacing: 1px; transition: all 0.3s; }

        /* 3D 照片卡片 */
        .element {
            width: 140px; height: 200px;
            border-radius: 8px; text-align: center; cursor: pointer;
            transition: box-shadow 0.4s, border 0.4s, background-color 0.4s;
            overflow: hidden;
            opacity: 0; pointer-events: none;
            will-change: transform, opacity;
        }
        /* 宇宙 A：星河粉紫 */
        .element.universe-A {
            box-shadow: 0px 0px 15px rgba(255,105,180,0.3);
            border: 1px solid rgba(255,105,180,0.3);
            background-color: rgba(10,0,20,0.8);
        }
        .element.universe-A:hover {
            box-shadow: 0px 0px 30px rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.9);
        }
        /* 宇宙 B：极光幽绿 */
        .element.universe-B {
            box-shadow: 0px 0px 15px rgba(0,191,255,0.3);
            border: 1px solid rgba(0,191,255,0.3);
            background-color: rgba(0,10,25,0.8);
        }
        .element.universe-B:hover {
            box-shadow: 0px 0px 30px rgba(0,255,200,0.9);
            border: 1px solid rgba(0,255,200,0.9);
        }

        .element img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.4s, transform 0.6s; pointer-events: none; -webkit-user-drag: none; }
        .element:hover img { opacity: 1; transform: scale(1.1); }

        #webgl-container, #css3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #webgl-container { z-index: 1; }
        #css3d-container { z-index: 2; }

        /* 事迹档案弹窗 */
        #detail-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            z-index: 2000; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        #detail-modal.active { display: flex; opacity: 1; }
        .detail-card {
            display: flex; width: 800px; height: 450px;
            background: linear-gradient(145deg, rgba(30,10,40,0.95), rgba(10,5,20,0.95));
            border: 1px solid rgba(255,105,180,0.5);
            box-shadow: 0 0 50px rgba(255,105,180,0.2), inset 0 0 20px rgba(255,255,255,0.05);
            border-radius: 20px; overflow: hidden; transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); position: relative;
        }
        #detail-modal.active .detail-card { transform: scale(1); }
        .detail-img-container { width: 50%; position: relative; overflow: hidden; }
        .detail-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .detail-text { width: 50%; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; }
        .detail-title { font-size: 24px; font-weight: 300; color: #fff; margin: 0 0 10px 0; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .detail-meta { font-size: 13px; color: #ffb6c1; margin-bottom: 20px; font-family: monospace; }
        .detail-desc { font-size: 15px; line-height: 1.8; color: #ccc; flex-grow: 1; overflow-y: auto; }
        .close-btn {
            background: rgba(255,105,180,0.2); border: 1px solid rgba(255,105,180,0.5);
            color: #fff; padding: 10px 0; border-radius: 8px; cursor: pointer;
            transition: all 0.3s; font-size: 14px; letter-spacing: 2px; margin-top: auto; width: 100%;
        }
        .close-btn:hover { background: rgba(255,105,180,0.6); box-shadow: 0 0 15px rgba(255,105,180,0.4); }
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none;
            color: rgba(255,255,255,0.3); font-size: 32px; padding: 10px; cursor: pointer;
            border-radius: 8px; transition: all 0.3s; z-index: 2010;
        }
        .nav-btn:hover { color: #fff; text-shadow: 0 0 20px rgba(255,105,180,0.9); transform: translateY(-50%) scale(1.1); }
        .left-nav { left: 15px; } .right-nav { right: 15px; }

        /* ZXY Logo */
        #logo-zxy {
            position: fixed; top: 40px; left: 50px; font-size: 38px;
            font-family: 'Georgia', serif; font-style: italic;
            color: rgba(255,255,255,0.95); letter-spacing: 8px; z-index: 1000;
            text-shadow: 0 0 20px rgba(255,105,180,0.8), 0 0 10px rgba(255,255,255,0.8);
            opacity: 0; transition: opacity 2s 1s; pointer-events: none;
        }

        /* 烟花画布 */
        #fireworks-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #countdown-text { z-index: 2; position: relative; }
        #birthday-greeting {
            position: absolute; z-index: 3; text-align: center; opacity: 0; transform: scale(0.8);
            transition: opacity 2s ease-out, transform 3s ease-out; pointer-events: none;
        }
        #birthday-greeting.show { opacity: 1; transform: scale(1); }
        .bday-title { font-size: 80px; font-weight: 200; color: #fff; letter-spacing: 8px; text-shadow: 0 0 40px rgba(255,105,180,1), 0 0 15px #fff; margin: 0; }
        .bday-sub { font-size: 26px; font-weight: 300; color: #ffb6c1; letter-spacing: 10px; margin-top: 25px; text-shadow: 0 0 20px rgba(255,105,180,0.8); }

        /* 音乐按钮 */
        #music-btn {
            position: fixed; top: 30px; right: 40px; width: 40px; height: 40px;
            background: rgba(255,105,180,0.1); border: 1px solid rgba(255,105,180,0.5);
            border-radius: 50%; color: #fff; font-size: 18px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 2000; transition: all 0.3s; opacity: 0.6; backdrop-filter: blur(5px);
        }
        #music-btn:hover { background: rgba(255,105,180,0.4); opacity: 1; box-shadow: 0 0 15px rgba(255,105,180,0.8); }
        .playing { animation: spin 4s linear infinite; opacity: 1 !important; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ==========================================
           回忆视频按钮 (宇宙 B)
           ========================================== */
        #memories-btn {
            position: fixed; top: 85px; right: 40px;
            width: 42px; height: 42px;
            background: rgba(0,191,255,0.08);
            border: 1px solid rgba(0,191,255,0.45);
            border-radius: 50%; color: #fff; font-size: 15px;
            display: none; justify-content: center; align-items: center;
            cursor: pointer; z-index: 2000; transition: all 0.35s ease;
            opacity: 0; backdrop-filter: blur(5px);
            pointer-events: none;
        }
        #memories-btn.visible {
            display: flex; opacity: 0.55; pointer-events: auto;
        }
        #memories-btn:hover {
            background: rgba(0,191,255,0.35); opacity: 1;
            box-shadow: 0 0 25px rgba(0,191,255,0.7), 0 0 50px rgba(0,191,255,0.25);
            transform: scale(1.1);
        }
        #memories-btn .pulse-ring {
            position: absolute; top: -6px; left: -6px; width: 54px; height: 54px;
            border-radius: 50%; border: 1px solid rgba(0,191,255,0.25);
            animation: pulseRing 2.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* ==========================================
           视频弹窗
           ========================================== */
        #video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(18px);
            z-index: 3000; display: none; justify-content: center; align-items: center; flex-direction: column;
            opacity: 0; transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        #video-overlay.active { display: flex; opacity: 1; }

        #video-overlay .video-wrapper {
            position: relative;
            width: 66vw; max-width: 1200px;
            border-radius: 18px;
            padding: 4px;
            background: linear-gradient(135deg, #00bfff, #8a2be2, #ff69b4, #00bfff, #8a2be2);
            background-size: 400% 400%;
            animation: borderShift 4s ease infinite;
            box-shadow:
                0 0 30px rgba(0,191,255,0.5),
                0 0 60px rgba(138,43,226,0.35),
                0 0 100px rgba(255,105,180,0.25),
                0 0 180px rgba(0,191,255,0.12),
                inset 0 0 30px rgba(0,0,0,0.3);
        }
        @keyframes borderShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #video-overlay .video-wrapper::before {
            content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(0,191,255,0.3), rgba(138,43,226,0.3), rgba(255,105,180,0.3), rgba(0,191,255,0.3));
            background-size: 400% 400%;
            animation: borderShift 4s ease infinite;
            z-index: -1;
            filter: blur(25px);
            pointer-events: none;
        }

        #video-overlay video {
            display: block; width: 100%; height: auto; max-height: 80vh;
            border-radius: 15px;
            background: #000;
            outline: none;
        }

        #video-overlay .video-title {
            color: rgba(255,255,255,0.8); font-size: 16px; letter-spacing: 6px;
            margin-bottom: 18px; font-weight: 300;
            text-shadow: 0 0 20px rgba(0,191,255,0.6);
        }

        #video-overlay .video-close {
            position: absolute; top: -50px; right: 0;
            background: rgba(0,191,255,0.1); border: 1px solid rgba(0,191,255,0.4);
            color: #fff; width: 38px; height: 38px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 20px; transition: all 0.3s; line-height: 1;
        }
        #video-overlay .video-close:hover {
            background: rgba(0,191,255,0.45);
            box-shadow: 0 0 25px rgba(0,191,255,0.7);
            transform: rotate(90deg);
        }

        /* 视频四角星光点缀 */
        #video-overlay .corner-spark {
            position: absolute; width: 14px; height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(0,191,255,0.9), 0 0 30px rgba(138,43,226,0.6);
            pointer-events: none;
            animation: sparkPulse 2s ease-in-out infinite;
        }
        #video-overlay .corner-spark.tl { top: -7px; left: -7px; animation-delay: 0s; }
        #video-overlay .corner-spark.tr { top: -7px; right: -7px; animation-delay: 0.5s; }
        #video-overlay .corner-spark.bl { bottom: -7px; left: -7px; animation-delay: 1s; }
        #video-overlay .corner-spark.br { bottom: -7px; right: -7px; animation-delay: 1.5s; }
        @keyframes sparkPulse {
            0%, 100% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        /* ==========================================
           双生宇宙穿梭按钮
           ========================================== */
        .portal-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,105,180,0.2);
            backdrop-filter: blur(10px); color: #fff; padding: 25px 12px;
            cursor: pointer; z-index: 1000; border-radius: 15px;
            font-size: 14px; letter-spacing: 4px;
            writing-mode: vertical-lr;
            transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
            opacity: 0; pointer-events: none;
            box-shadow: 0 0 15px rgba(255,105,180,0.05);
        }
        .portal-btn:hover {
            background: rgba(255,105,180,0.15);
            border-color: rgba(255,105,180,0.8);
            box-shadow: 0 0 25px rgba(255,105,180,0.4);
            color: #ffb6c1; text-shadow: 0 0 10px rgba(255,105,180,0.8);
            transform: translateY(-50%) scale(1.05);
        }
        #portal-left { left: 30px; border-color: rgba(0,191,255,0.2); }
        #portal-left:hover { border-color: rgba(0,191,255,0.8); box-shadow: 0 0 25px rgba(0,191,255,0.4); color: #00bfff; text-shadow: 0 0 10px rgba(0,191,255,0.8); }
        #portal-right { right: 30px; }

        /* 穿梭跃迁闪光帷幕 */
        #warp-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 4000; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        /* ==========================================
           移动端横屏适配 (高度 ≤ 600px)
           ========================================== */
        @media (max-height: 600px) {
            /* 3D 照片卡片等比缩小 */
            .element { width: 100px; height: 145px; }

            /* 底部操控栏 */
            .instruction { padding: 8px 18px; border-radius: 30px; }
            .keys { gap: 8px; }
            .key-btn { padding: 4px 10px; font-size: 11px; border-radius: 16px; }
            .key-btn span.num { padding: 1px 6px; font-size: 10px; }
            .mouse-hint { margin-top: 6px; font-size: 10px; }

            /* 穿梭按钮 */
            .portal-btn { padding: 14px 7px; font-size: 11px; letter-spacing: 2px; border-radius: 10px; }
            #portal-left { left: 10px; }
            #portal-right { right: 10px; }

            /* Logo */
            #logo-zxy { top: 12px; left: 15px; font-size: 24px; letter-spacing: 5px; }

            /* 音乐按钮 */
            #music-btn { top: 10px; right: 15px; width: 30px; height: 30px; font-size: 14px; }

            /* 回忆按钮 */
            #memories-btn { top: 50px; right: 15px; width: 30px; height: 30px; font-size: 12px; }
            #memories-btn .pulse-ring { top: -4px; left: -4px; width: 38px; height: 38px; }

            /* 视频弹窗 */
            #video-overlay .video-wrapper { width: 85vw; }
            #video-overlay .video-title { font-size: 13px; letter-spacing: 4px; margin-bottom: 12px; }
            #video-overlay .video-close { top: -38px; width: 30px; height: 30px; font-size: 16px; }

            /* 开场倒计时 */
            #countdown-text { font-size: 100px; }
            .bday-title { font-size: 44px; letter-spacing: 4px; }
            .bday-sub { font-size: 17px; margin-top: 15px; letter-spacing: 6px; }

            /* 档案弹窗 */
            .detail-card { width: 600px; height: 320px; border-radius: 14px; }
            .detail-text { padding: 20px 28px; }
            .detail-title { font-size: 18px; padding-bottom: 10px; }
            .detail-meta { font-size: 11px; margin-bottom: 12px; }
            .detail-desc { font-size: 13px; line-height: 1.6; }
            .close-btn { padding: 8px 0; font-size: 12px; letter-spacing: 1px; }
            .nav-btn { font-size: 24px; padding: 6px; }
        }

        @media (max-height: 400px) {
            /* 超矮屏幕进一步压缩 */
            .element { width: 80px; height: 116px; }
            .detail-card { width: 500px; height: 260px; }
            .detail-text { padding: 14px 20px; }
            .detail-title { font-size: 16px; }
            .detail-desc { font-size: 11px; line-height: 1.4; }
            .bday-title { font-size: 34px; }
            .bday-sub { font-size: 14px; }
            .instruction { padding: 5px 14px; }
            .key-btn { padding: 3px 8px; font-size: 10px; }
            .portal-btn { padding: 10px 5px; font-size: 10px; }
            #logo-zxy { top: 8px; left: 10px; font-size: 20px; }
            #memories-btn { top: 42px; right: 12px; width: 26px; height: 26px; font-size: 10px; }
            #memories-btn .pulse-ring { top: -3px; left: -3px; width: 32px; height: 32px; }
            #video-overlay .video-wrapper { width: 90vw; }
            #video-overlay .video-title { font-size: 11px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <div id="music-btn" onclick="toggleMusic()">🎵</div>

    <!-- 宇宙 B 回忆视频按钮 -->
    <div id="memories-btn" onclick="openVideo()">
        <div class="pulse-ring"></div>
        💫
    </div>

    <!-- 视频弹窗 -->
    <div id="video-overlay">
        <div class="video-title">✦ 我们的回忆 ✦</div>
        <div class="video-wrapper">
            <div class="corner-spark tl"></div>
            <div class="corner-spark tr"></div>
            <div class="corner-spark bl"></div>
            <div class="corner-spark br"></div>
            <div class="video-close" onclick="closeVideo(event)">✕</div>
            <video id="memory-video" controls playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div id="logo-zxy">ZXY</div>

    <!-- 双生宇宙 -->
    <div id="warp-flash"></div>
    <button id="portal-left" class="portal-btn" onclick="switchUniverse('A')">⬅ 返回：星光原乡</button>
    <button id="portal-right" class="portal-btn" onclick="switchUniverse('B')">穿梭：共同回忆 ➡</button>

    <div id="intro-screen">
        <canvas id="fireworks-canvas"></canvas>
        <div id="countdown-text"></div>
        <div id="birthday-greeting">
            <h1 class="bday-title">Happy Birthday</h1>
            <div class="bday-sub">ZXY，愿你的世界永远星光璀璨</div>
        </div>
    </div>

    <div id="webgl-container"></div>
    <div id="css3d-container"></div>

    <div id="menu">
        <div class="instruction">
            <div class="keys">
                <div class="key-btn"><span class="num">1</span> 混沌</div>
                <div class="key-btn"><span class="num">2</span> 星球</div>
                <div class="key-btn"><span class="num">3</span> 螺旋</div>
                <div class="key-btn"><span class="num">4</span> 矩阵</div>
                <div class="key-btn"><span class="num">5</span> 星海</div>
                <div class="key-btn" id="btn-reveal"><span class="num">0</span> 唤醒记忆</div>
            </div>
            <div class="mouse-hint" id="status-text">当前状态：星系沉睡中 | 切换形态(1-5) | 按 0 唤醒照片</div>
        </div>
    </div>

    <div id="detail-modal">
        <div class="detail-card">
            <button class="nav-btn left-nav" onclick="prevPhoto(event)">&#10094;</button>
            <button class="nav-btn right-nav" onclick="nextPhoto(event)">&#10095;</button>
            <div class="detail-img-container"><img id="detail-img" src="" alt="" crossorigin="anonymous"></div>
            <div class="detail-text">
                <h2 class="detail-title">星空纪元·绝密档案</h2>
                <div class="detail-meta" id="detail-time">记录时间：载入中...</div>
                <div class="detail-desc" id="detail-desc">正在解密星光背后的故事...</div>
                <button class="close-btn" onclick="closeDetail()">关闭档案</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

    <script>

        // ==========================================
        // 3D 物理流星实体类
        // ==========================================
        class Meteor {
            constructor(scene) {
                this.scene = scene;
                this.start = new THREE.Vector3(
                    random(-4000, 10000), random(4000, 6000), random(-8000, 8000)
                );
                this.pos = this.start.clone();
                this.dir = new THREE.Vector3(-1.6, -1.0, -0.4).normalize();
                this.speed = random(90, 160);
                this.length = random(1200, 2800);
                this.active = true;

                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(6);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const colorArray = new Float32Array(6);
                const headColor = new THREE.Color(1, 1, 1);
                const tailColor = new THREE.Color();
                const rand = Math.random();
                if (rand < 0.4) { tailColor.setHSL(0.9, 1.0, 0.5); }
                else if (rand < 0.8) { tailColor.setHSL(0.55, 1.0, 0.5); }
                else { tailColor.setHSL(0.1, 1.0, 0.5); }
                colorArray[0] = headColor.r; colorArray[1] = headColor.g; colorArray[2] = headColor.b;
                colorArray[3] = tailColor.r; colorArray[4] = tailColor.g; colorArray[5] = tailColor.b;
                geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

                const material = new THREE.LineBasicMaterial({
                    vertexColors: true, transparent: true, opacity: random(0.9, 1.0),
                    blending: THREE.AdditiveBlending, depthWrite: false, linewidth: 2
                });
                this.line = new THREE.Line(geometry, material);
                this.scene.add(this.line);
                this.updateLineGeometry();
            }
            update() {
                if (!this.active) return;
                this.pos.addScaledVector(this.dir, this.speed);
                this.updateLineGeometry();
                if (this.pos.y < -5000 || this.pos.x < -10000 || this.pos.z < -10000) { this.destroy(); }
            }
            updateLineGeometry() {
                const positions = this.line.geometry.attributes.position.array;
                positions[0] = this.pos.x; positions[1] = this.pos.y; positions[2] = this.pos.z;
                positions[3] = this.pos.x - this.dir.x * this.length;
                positions[4] = this.pos.y - this.dir.y * this.length;
                positions[5] = this.pos.z - this.dir.z * this.length;
                this.line.geometry.attributes.position.needsUpdate = true;
            }
            destroy() {
                this.active = false;
                this.scene.remove(this.line);
                this.line.geometry.dispose();
                this.line.material.dispose();
            }
        }

        // ==========================================
        // 2D 烟花系统
        // ==========================================
        const fwCanvas = document.getElementById('fireworks-canvas');
        const fwCtx = fwCanvas.getContext('2d');
        let fwWidth, fwHeight;
        let fireworks = [], fwParticles = [], fwAnimationId = null, isFinale = false;

        function resizeFwCanvas() {
            fwWidth = window.innerWidth; fwHeight = window.innerHeight;
            fwCanvas.width = fwWidth; fwCanvas.height = fwHeight;
        }
        window.addEventListener('resize', resizeFwCanvas);
        resizeFwCanvas();

        function random(min, max) { return Math.random() * (max - min) + min; }

        class Firework {
            constructor(startX, isGrand = false) {
                this.x = startX || random(fwWidth * 0.1, fwWidth * 0.9);
                this.y = fwHeight;
                this.targetY = random(fwHeight * 0.1, fwHeight * 0.35);
                this.speed = random(14, 22);
                this.angle = random(-Math.PI * 0.55, -Math.PI * 0.45);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.color = Math.random() > 0.3 ? `hsl(${random(290,340)}, 100%, 65%)` : `hsl(${random(30,60)}, 100%, 70%)`;
                this.isGrand = isGrand;
                this.trail = [];
            }
            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();
                this.x += this.vx; this.y += this.vy; this.vy += 0.25;
                if (this.vy >= 0 || this.y <= this.targetY) { this.explode(); return false; }
                return true;
            }
            draw() {
                fwCtx.beginPath();
                fwCtx.moveTo(this.trail[0]?.x || this.x, this.trail[0]?.y || this.y);
                fwCtx.lineTo(this.x, this.y);
                fwCtx.strokeStyle = '#fff'; fwCtx.lineWidth = 3; fwCtx.stroke();
            }
            explode() {
                const pCount = this.isGrand ? 250 : 100;
                if (this.isGrand) { fwCtx.fillStyle = 'rgba(255,255,255,0.4)'; fwCtx.fillRect(0, 0, fwWidth, fwHeight); }
                for (let i = 0; i < pCount; i++) {
                    fwParticles.push(new FWParticle(this.x, this.y, this.color, this.isGrand));
                }
            }
        }

        class FWParticle {
            constructor(x, y, color, isGrand) {
                this.x = x; this.y = y;
                const angle = random(0, Math.PI * 2);
                const speed = isGrand ? random(2, 22) : random(1, 14);
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.friction = 0.94; this.gravity = 0.12; this.alpha = 1;
                this.decay = random(0.01, 0.025);
                this.color = Math.random() < 0.1 ? '#ffffff' : color;
                this.size = random(1.5, 3.5);
            }
            update() {
                this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy; this.alpha -= this.decay;
                return this.alpha > 0;
            }
            draw() {
                fwCtx.globalAlpha = this.alpha;
                fwCtx.beginPath();
                fwCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                fwCtx.fillStyle = this.color; fwCtx.fill();
                fwCtx.globalAlpha = 1;
            }
        }

        function animateFireworks() {
            fwCtx.globalCompositeOperation = 'destination-out';
            fwCtx.fillStyle = 'rgba(0, 0, 0, 0.25)'; fwCtx.fillRect(0, 0, fwWidth, fwHeight);
            fwCtx.globalCompositeOperation = 'lighter';
            if (!isFinale && Math.random() < 0.08) fireworks.push(new Firework());
            fireworks = fireworks.filter(fw => { fw.draw(); return fw.update(); });
            fwParticles = fwParticles.filter(p => { p.draw(); return p.update(); });
            fwAnimationId = requestAnimationFrame(animateFireworks);
        }

        // ==========================================
        // 开场倒计时
        // ==========================================
        startIntroSequence();

        function startIntroSequence() {
            const textEl = document.getElementById('countdown-text');
            const greetingEl = document.getElementById('birthday-greeting');
            const introScreen = document.getElementById('intro-screen');
            const sequence = ['3', '2', '1'];
            let step = 0;

            function nextTick() {
                if (step < sequence.length) {
                    textEl.innerText = sequence[step];
                    textEl.className = '';
                    void textEl.offsetWidth;
                    textEl.className = 'heartbeat-anim';
                    step++;
                    setTimeout(nextTick, 1000);
                } else {
                    textEl.style.display = 'none';
                    animateFireworks();
                    setTimeout(() => { greetingEl.classList.add('show'); }, 1500);
                    setTimeout(() => {
                        isFinale = true;
                        fireworks.push(new Firework(fwWidth * 0.2, true));
                        fireworks.push(new Firework(fwWidth * 0.4, true));
                        fireworks.push(new Firework(fwWidth * 0.6, true));
                        fireworks.push(new Firework(fwWidth * 0.8, true));
                    }, 5500);
                    setTimeout(() => {
                        introScreen.style.opacity = 0;
                        setTimeout(() => {
                            introScreen.style.display = 'none';
                            cancelAnimationFrame(fwAnimationId);
                            document.getElementById('menu').style.opacity = 1;
                            document.getElementById('logo-zxy').style.opacity = 1;
                            document.getElementById('portal-right').style.opacity = 1;
                            document.getElementById('portal-right').style.pointerEvents = 'auto';
                            init3DScene();
                        }, 1500);
                    }, 7500);
                }
            }
            nextTick();
        }

        // ==========================================
        // 3D 核心渲染
        // ==========================================
        function init3DScene() {
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 30000);
            camera.position.z = Math.max(4500, photoCount * 20);

            webglScene = new THREE.Scene();
            webglScene.fog = new THREE.FogExp2(0x050010, 0.00015);
            cssScene = new THREE.Scene();

            createBgParticles();
            createParticles();
            createPhotos();

            webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            webglRenderer.setPixelRatio(window.devicePixelRatio);
            webglRenderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('webgl-container').appendChild(webglRenderer.domElement);

            cssRenderer = new THREE.CSS3DRenderer();
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('css3d-container').appendChild(cssRenderer.domElement);

            controls = new THREE.OrbitControls(camera, cssRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 500;
            controls.maxDistance = 15000;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.6;

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);

            // 触屏设备：底部按钮可点击切换形态 / 唤醒照片
            document.querySelector('.keys').addEventListener('click', function (e) {
                const btn = e.target.closest('.key-btn');
                if (!btn) return;

                if (btn.id === 'btn-reveal') {
                    TWEEN.removeAll();
                    if (!isRevealed) { executeAwakening(); }
                    else { executeConcealing(); }
                } else {
                    const numSpan = btn.querySelector('.num');
                    if (!numSpan) return;
                    const key = numSpan.textContent.trim();
                    if (['1', '2', '3', '4', '5'].includes(key)) {
                        TWEEN.removeAll();
                        currentShapeId = key;
                        const layoutMap = currentUniverse === 'A' ? layoutsA : layoutsB;
                        const layoutName = layoutMap[key];
                        transformParticles(particleTargets[layoutName], 2000);
                        if (isRevealed) {
                            transformPhotos(photoTargets[layoutName], 2000, TWEEN.Easing.Exponential.InOut);
                        }
                    }
                }
            });

            // 移动端：触摸轻点照片 → 打开档案（OrbitControls 会拦截 click，需手动检测 tap）
            let touchStartAt = 0, touchDidMove = false;
            cssRenderer.domElement.addEventListener('touchstart', () => {
                touchStartAt = Date.now();
                touchDidMove = false;
            }, { passive: true });
            cssRenderer.domElement.addEventListener('touchmove', () => {
                touchDidMove = true;
            }, { passive: true });
            cssRenderer.domElement.addEventListener('touchend', (e) => {
                if (touchDidMove || Date.now() - touchStartAt > 300) return;
                const touch = e.changedTouches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                const photoEl = el?.closest('.element');
                if (photoEl && photoEl.style.pointerEvents !== 'none') {
                    const idx = objects.findIndex(obj => obj.element === photoEl);
                    if (idx >= 0) openDetail(idx);
                }
            });

            animate();
        }

        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const color = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                let i3 = i * 3;

                // ========== 宇宙 A 粒子坐标 ==========
                particleTargets.scatter[i3] = (Math.random() - 0.5) * 12000;
                particleTargets.scatter[i3 + 1] = (Math.random() - 0.5) * 12000;
                particleTargets.scatter[i3 + 2] = (Math.random() - 0.5) * 12000;

                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;
                const rSphere = 1400 + (Math.random() - 0.5) * 300;
                particleTargets.sphere[i3] = rSphere * Math.sin(phi) * Math.cos(theta);
                particleTargets.sphere[i3 + 1] = rSphere * Math.sin(phi) * Math.sin(theta);
                particleTargets.sphere[i3 + 2] = rSphere * Math.cos(phi);

                const strand = (i % 2) * Math.PI;
                const thetaHelix = i * 0.01 + strand;
                const rHelix = 1500 + (Math.random() - 0.5) * 800;
                particleTargets.helix[i3] = rHelix * Math.cos(thetaHelix);
                particleTargets.helix[i3 + 1] = -(i * 0.6) + 2500;
                particleTargets.helix[i3 + 2] = rHelix * Math.sin(thetaHelix);

                const cols = 25, rows = 20, depth = 16;
                const col = i % cols, row = Math.floor(i / cols) % rows, dep = Math.floor(i / (cols * rows));
                particleTargets.grid[i3] = (col * 180) - (cols * 180 / 2) + (Math.random() - 0.5) * 100;
                particleTargets.grid[i3 + 1] = -(row * 180) + (rows * 180 / 2) + (Math.random() - 0.5) * 100;
                particleTargets.grid[i3 + 2] = (dep * 350) - (depth * 350 / 2);

                const t = Math.random() * Math.PI * 2;
                const rScale = Math.pow(Math.random(), 0.5) * 0.9 + 0.1;
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                particleTargets.heart[i3] = hx * 75 * rScale + (Math.random() - 0.5) * 200;
                particleTargets.heart[i3 + 1] = hy * 75 * rScale + 200 + (Math.random() - 0.5) * 200;
                particleTargets.heart[i3 + 2] = (Math.random() - 0.5) * 1800;

                // ========== 宇宙 B 粒子坐标 ==========
                const waveCol = i % 80;
                const waveRow = Math.floor(i / 80);
                particleTargets.wave[i3] = (waveCol - 40) * 180 + (Math.random() - 0.5) * 50;
                particleTargets.wave[i3 + 2] = (waveRow - 50) * 180 + (Math.random() - 0.5) * 50;
                particleTargets.wave[i3 + 1] = Math.sin(waveCol * 0.15) * Math.cos(waveRow * 0.15) * 600 + (Math.random() - 0.5) * 200;

                const tTheta = (i / particleCount) * Math.PI * 16;
                const tRadius = 1500 + (Math.random() - 0.5) * 400;
                particleTargets.tunnel[i3] = tRadius * Math.cos(tTheta);
                particleTargets.tunnel[i3 + 1] = (i * 1.5) - 6000;
                particleTargets.tunnel[i3 + 2] = tRadius * Math.sin(tTheta);

                if (i % 2 === 0) {
                    const rTheta = (i / particleCount) * Math.PI * 4;
                    const rr = 1600 + (Math.random() - 0.5) * 150;
                    particleTargets.rings[i3] = rr * Math.cos(rTheta);
                    particleTargets.rings[i3 + 1] = (Math.random() - 0.5) * 100;
                    particleTargets.rings[i3 + 2] = rr * Math.sin(rTheta);
                } else {
                    const rTheta = (i / particleCount) * Math.PI * 4;
                    const rr = 1600 + (Math.random() - 0.5) * 150;
                    particleTargets.rings[i3] = rr * Math.cos(rTheta);
                    particleTargets.rings[i3 + 1] = rr * Math.sin(rTheta);
                    particleTargets.rings[i3 + 2] = (Math.random() - 0.5) * 100;
                }

                const pLayer = Math.floor(i / (particleCount / 6));
                const pRadius = (6 - pLayer) * 450;
                const pTheta = Math.random() * Math.PI * 2;
                particleTargets.pyramid[i3] = pRadius * Math.cos(pTheta) + (Math.random() - 0.5) * 200;
                particleTargets.pyramid[i3 + 1] = pLayer * 500 - 1500 + (Math.random() - 0.5) * 100;
                particleTargets.pyramid[i3 + 2] = pRadius * Math.sin(pTheta) + (Math.random() - 0.5) * 200;

                const infT = (i / particleCount) * Math.PI * 4;
                const infDenom = 1 + Math.sin(infT) * Math.sin(infT);
                const infScale = 2200;
                particleTargets.infinity[i3] = (infScale * Math.cos(infT)) / infDenom + (Math.random() - 0.5) * 150;
                particleTargets.infinity[i3 + 1] = (infScale * Math.sin(infT) * Math.cos(infT)) / infDenom + (Math.random() - 0.5) * 150;
                particleTargets.infinity[i3 + 2] = Math.sin(infT * 2) * 500 + (Math.random() - 0.5) * 250;

                // ========== 双宇宙颜色 ==========
                const rand = Math.random();
                let hA;
                if (rand < 0.3) hA = 0.55 + Math.random() * 0.1;
                else if (rand < 0.6) hA = 0.75 + Math.random() * 0.1;
                else if (rand < 0.85) hA = 0.9 + Math.random() * 0.1;
                else hA = 0.1 + Math.random() * 0.05;
                color.setHSL(hA, 1.0, 0.7 + Math.random() * 0.3);
                colorsA.push(color.r, color.g, color.b);

                let hB;
                if (rand < 0.35) hB = 0.45 + Math.random() * 0.08;
                else if (rand < 0.65) hB = 0.53 + Math.random() * 0.07;
                else if (rand < 0.85) hB = 0.32 + Math.random() * 0.08;
                else hB = 0.12 + Math.random() * 0.05;
                color.setHSL(hB, 1.0, 0.65 + Math.random() * 0.35);
                colorsB.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particleTargets.scatter), 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colorsA, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.3, 'rgba(255,255,255,0.9)');
            grd.addColorStop(0.7, 'rgba(255,255,255,0.3)');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({ size: 42, map: texture, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
            particleSystem = new THREE.Points(geometry, material);
            webglScene.add(particleSystem);
        }

        function createBgParticles() {
            const bgGeometry = new THREE.BufferGeometry();
            const bgPositions = new Float32Array(bgParticleCount * 3);
            const bgColors = [];
            const color = new THREE.Color();

            for (let i = 0; i < bgParticleCount; i++) {
                bgPositions[i * 3] = (Math.random() - 0.5) * 25000;
                bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 25000;
                bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 25000;
                color.setHSL(0.55 + Math.random() * 0.1, 0.9, 0.6 + Math.random() * 0.4);
                bgColors.push(color.r, color.g, color.b);
            }
            bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
            bgGeometry.setAttribute('color', new THREE.Float32BufferAttribute(bgColors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.4, 'rgba(0,191,255,0.9)');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 16, 16);
            const bgTexture = new THREE.CanvasTexture(canvas);

            const bgMaterial = new THREE.PointsMaterial({ size: 35, map: bgTexture, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
            bgParticleSystem = new THREE.Points(bgGeometry, bgMaterial);
            webglScene.add(bgParticleSystem);
        }

        // 👇👇👇 【本地图片配置】 👇👇👇
        const PLACEHOLDER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="200" viewBox="0 0 150 200"><rect width="100%" height="100%" fill="%231a0033"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="11" fill="%23ff69b4">★ 加载中</text></svg>';
        const THUMB_W = 150, THUMB_H = 200;

        // Canvas 缩略图生成器 —— 支持任意文件夹 + 扩展名自动回退
        function loadThumbnail(imgEl, index, folder) {
            const exts = ['jpg', 'png'];
            let attempt = 0;
            const loader = new Image();
            // loader.crossOrigin = 'anonymous';
            loader.onload = function () {
                const c = document.createElement('canvas');
                c.width = THUMB_W; c.height = THUMB_H;
                const ctx = c.getContext('2d');
                const s = Math.max(THUMB_W / loader.width, THUMB_H / loader.height);
                const sw = THUMB_W / s, sh = THUMB_H / s;
                const sx = (loader.width - sw) / 2, sy = (loader.height - sh) / 2;
                ctx.drawImage(loader, sx, sy, sw, sh, 0, 0, THUMB_W, THUMB_H);
                imgEl.src = c.toDataURL('image/jpeg', 0.75);
                imgEl.dataset.highres = loader.src;
            };
            loader.onerror = function () {
                attempt++;
                if (attempt < exts.length) {
                    loader.src = `${folder}/${index}.${exts[attempt]}`;
                }
            };
            loader.src = `${folder}/${index}.jpg`;
        }

        function createPhotos() {
            const vector = new THREE.Vector3();

            // 宇宙 A 参数
            const adaptiveSphereRadius = Math.max(1200, Math.sqrt(photoCount) * 110);
            const adaptiveHelixSpacing = Math.max(15, 6000 / photoCount);
            const matrixSide = Math.ceil(Math.cbrt(photoCount));
            const spacingX = 350, spacingY = 400, spacingZ = 600;
            const adaptiveHeartScale = Math.max(65, Math.sqrt(photoCount) * 6);

            // 宇宙 B 参数
            const bWaveCols = 15;
            const bWaveRows = Math.ceil(photoCount / bWaveCols);
            const bPyramidLayers = 5;
            const bPyramidCountPerLayer = photoCount / bPyramidLayers;

            for (let i = 0; i < photoCount; i++) {
                const element = document.createElement('div');
                element.className = 'element universe-A';
                const img = document.createElement('img');

                // 初始加载宇宙 A 图片 (image1/)
                const indexA = (i % TOTAL_LOCAL_IMAGES_A) + 1;
                img.src = PLACEHOLDER;
                loadThumbnail(img, indexA, 'image1');

                // img.crossOrigin = "anonymous";
                img.draggable = false;
                element.appendChild(img);
                element.onclick = (e) => { e.stopPropagation(); openDetail(i); };

                const object = new THREE.CSS3DObject(element);
                cssScene.add(object);
                objects.push(object);

                // ========== 宇宙 A 照片目标 ==========
                const tScatter = new THREE.Object3D();
                tScatter.position.set((Math.random() - 0.5) * 8000, (Math.random() - 0.5) * 8000, (Math.random() - 0.5) * 8000);
                tScatter.rotation.set(Math.random() * 2 * Math.PI, Math.random() * 2 * Math.PI, Math.random() * 2 * Math.PI);
                photoTargets.scatter.push(tScatter);

                const tSphere = new THREE.Object3D();
                const phi = Math.acos(-1 + (2 * i) / photoCount);
                const theta = Math.sqrt(photoCount * Math.PI) * phi;
                tSphere.position.setFromSphericalCoords(adaptiveSphereRadius, phi, theta);
                vector.copy(tSphere.position).multiplyScalar(2);
                tSphere.lookAt(vector);
                photoTargets.sphere.push(tSphere);

                const tHelix = new THREE.Object3D();
                const strand = (i % 2) * Math.PI;
                const thetaHelix = i * 0.15 + strand;
                const yHelix = -(i * adaptiveHelixSpacing) + (photoCount * adaptiveHelixSpacing / 2);
                tHelix.position.setFromCylindricalCoords(1500, thetaHelix, yHelix);
                vector.set(tHelix.position.x * 2, tHelix.position.y, tHelix.position.z * 2);
                tHelix.lookAt(vector);
                photoTargets.helix.push(tHelix);

                const tGrid = new THREE.Object3D();
                const col = i % matrixSide;
                const row = Math.floor(i / matrixSide) % matrixSide;
                const dep = Math.floor(i / (matrixSide * matrixSide));
                tGrid.position.set(
                    (col * spacingX) - (matrixSide * spacingX / 2) + (spacingX / 2),
                    -(row * spacingY) + (matrixSide * spacingY / 2) - (spacingY / 2),
                    (dep * spacingZ) - ((Math.ceil(photoCount / (matrixSide * matrixSide)) * spacingZ) / 2)
                );
                photoTargets.grid.push(tGrid);

                const tHeart = new THREE.Object3D();
                const ht = Math.random() * Math.PI * 2;
                const hrScale = 0.4 + Math.random() * 0.6;
                const hx = 16 * Math.pow(Math.sin(ht), 3);
                const hy = 13 * Math.cos(ht) - 5 * Math.cos(2 * ht) - 2 * Math.cos(3 * ht) - Math.cos(4 * ht);
                tHeart.position.set(
                    hx * adaptiveHeartScale * hrScale + random(-100, 100),
                    hy * adaptiveHeartScale * hrScale + 200 + random(-100, 100),
                    random(-600, 600)
                );
                vector.set(0, 200, 2000);
                tHeart.lookAt(vector);
                photoTargets.heart.push(tHeart);

                // ========== 宇宙 B 照片目标 ==========
                const tWave = new THREE.Object3D();
                const wCol = i % bWaveCols;
                const wRow = Math.floor(i / bWaveCols);
                const wx = (wCol - (bWaveCols / 2)) * 250;
                const wz = (wRow - (bWaveRows / 2)) * 250;
                const wy = Math.sin(wCol * 0.5) * Math.cos(wRow * 0.5) * 400;
                tWave.position.set(wx, wy, wz);
                vector.set(wx, wy + 2000, wz - 500);
                tWave.lookAt(vector);
                photoTargets.wave.push(tWave);

                const tTunnel = new THREE.Object3D();
                const tuTheta = (i / photoCount) * Math.PI * 4;
                const tuRadius = 1300;
                const tuY = (i * 24) - (photoCount * 12);
                tTunnel.position.set(tuRadius * Math.cos(tuTheta), tuY, tuRadius * Math.sin(tuTheta));
                vector.set(0, tuY, 0);
                tTunnel.lookAt(vector);
                photoTargets.tunnel.push(tTunnel);

                const tRings = new THREE.Object3D();
                if (i % 2 === 0) {
                    const rTh = (i / (photoCount / 2)) * Math.PI * 2;
                    tRings.position.set(1500 * Math.cos(rTh), 0, 1500 * Math.sin(rTh));
                    vector.set(0, 0, 0); tRings.lookAt(vector);
                } else {
                    const rTh = (i / (photoCount / 2)) * Math.PI * 2;
                    tRings.position.set(1500 * Math.cos(rTh), 1500 * Math.sin(rTh), 0);
                    vector.set(0, 0, 0); tRings.lookAt(vector);
                }
                photoTargets.rings.push(tRings);

                const tPyramid = new THREE.Object3D();
                const pyLayer = Math.floor(i / bPyramidCountPerLayer);
                const pyIndex = i % bPyramidCountPerLayer;
                const pyRadius = (bPyramidLayers - pyLayer) * 400 + 100;
                const pyTheta = (pyIndex / bPyramidCountPerLayer) * Math.PI * 2;
                const pyH = pyLayer * 400 - 600;
                tPyramid.position.set(pyRadius * Math.cos(pyTheta), pyH, pyRadius * Math.sin(pyTheta));
                vector.set(0, pyH + 300, 0);
                tPyramid.lookAt(vector);
                photoTargets.pyramid.push(tPyramid);

                const tInfinity = new THREE.Object3D();
                const infT = (i / photoCount) * Math.PI * 2;
                const infDenom = 1 + Math.sin(infT) * Math.sin(infT);
                const infScale = 1800;
                tInfinity.position.set(
                    (infScale * Math.cos(infT)) / infDenom,
                    (infScale * Math.sin(infT) * Math.cos(infT)) / infDenom,
                    Math.sin(infT * 2) * 400
                );
                vector.set(0, 0, 0);
                tInfinity.lookAt(vector);
                photoTargets.infinity.push(tInfinity);
            }
        }

        // ==========================================
        // 键盘交互
        // ==========================================
        function onKeyDown(event) {
            const key = event.key;
            if (['1', '2', '3', '4', '5', '0'].includes(key)) { TWEEN.removeAll(); }

            if (['1', '2', '3', '4', '5'].includes(key)) {
                currentShapeId = key;
                const layoutMap = (currentUniverse === 'A') ? layoutsA : layoutsB;
                const layoutName = layoutMap[key];
                transformParticles(particleTargets[layoutName], 2000);
                if (isRevealed) {
                    transformPhotos(photoTargets[layoutName], 2000, TWEEN.Easing.Exponential.InOut);
                }
            }
            if (key === '0') {
                if (!isRevealed) { executeAwakening(); }
                else { executeConcealing(); }
            }
        }

        // ==========================================
        // 🌟 超空间穿梭：双宇宙跃迁核心
        // ==========================================
        function switchUniverse(dest) {
            if (currentUniverse === dest) return;

            const flash = document.getElementById('warp-flash');
            const leftPortal = document.getElementById('portal-left');
            const rightPortal = document.getElementById('portal-right');

            leftPortal.style.pointerEvents = 'none';
            rightPortal.style.pointerEvents = 'none';

            // 1. 闪光帷幕
            flash.style.opacity = 1;

            // 2. 相机高速旋转
            controls.autoRotateSpeed = 22;
            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 0, z: 120 }, 600)
                .easing(TWEEN.Easing.Cubic.In)
                .start();

            // 3. 粒子爆破
            new TWEEN.Tween(particleSystem.scale)
                .to({ x: 3, y: 3, z: 3 }, 500)
                .easing(TWEEN.Easing.Cubic.In)
                .start();

            // 4. 时空中转（550ms 后重组）
            setTimeout(() => {
                currentUniverse = dest;
                isRevealed = false;
                currentShapeId = '1';

                // 雾效
                if (dest === 'B') {
                    webglScene.fog.color.setHex(0x000d1a);
                    activeCustomLogs = customLogsB;

                    // 切换图片源 → image2/
                    objects.forEach((obj, idx) => {
                        const img = obj.element.querySelector('img');
                        const indexB = (idx % TOTAL_LOCAL_IMAGES_B) + 1;
                        img.src = PLACEHOLDER;
                        loadThumbnail(img, indexB, 'image2');
                        obj.element.classList.remove('universe-A');
                        obj.element.classList.add('universe-B');
                    });

                    rightPortal.style.opacity = 0;
                    // 显示回忆按钮
                    const memBtn = document.getElementById('memories-btn');
                    memBtn.classList.add('visible');
                    setTimeout(() => {
                        leftPortal.style.opacity = 1;
                        leftPortal.style.pointerEvents = 'auto';
                    }, 500);
                } else {
                    webglScene.fog.color.setHex(0x050010);
                    activeCustomLogs = customLogsA;

                    // 切换图片源 → image1/
                    objects.forEach((obj, idx) => {
                        const img = obj.element.querySelector('img');
                        const indexA = (idx % TOTAL_LOCAL_IMAGES_A) + 1;
                        img.src = PLACEHOLDER;
                        loadThumbnail(img, indexA, 'image1');
                        obj.element.classList.remove('universe-B');
                        obj.element.classList.add('universe-A');
                    });

                    leftPortal.style.opacity = 0;
                    // 隐藏回忆按钮
                    document.getElementById('memories-btn').classList.remove('visible');
                    setTimeout(() => {
                        rightPortal.style.opacity = 1;
                        rightPortal.style.pointerEvents = 'auto';
                    }, 500);
                }

                // 5. 隐藏所有照片
                objects.forEach((obj) => {
                    obj.element.style.opacity = 0;
                    obj.element.style.pointerEvents = 'none';
                    obj.scale.set(0.01, 0.01, 0.01);
                    obj.position.set((Math.random() - 0.5) * 8000, (Math.random() - 0.5) * 8000, (Math.random() - 0.5) * 8000);
                });

                // 6. 更新菜单标签
                updateMenuLabels();

                // 7. 粒子颜色渐变
                const colorTargetT = dest === 'B' ? 1 : 0;
                new TWEEN.Tween(colorProgress)
                    .to({ t: colorTargetT }, 1500)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => {
                        const posColor = particleSystem.geometry.attributes.color.array;
                        for (let i = 0; i < particleCount * 3; i++) {
                            posColor[i] = colorsA[i] + (colorsB[i] - colorsA[i]) * colorProgress.t;
                        }
                        particleSystem.geometry.attributes.color.needsUpdate = true;
                    })
                    .start();

                // 8. 粒子形态归位
                particleSystem.scale.set(0.1, 0.1, 0.1);
                const startLayout = (dest === 'A') ? 'scatter' : 'wave';
                transformParticles(particleTargets[startLayout], 1500);

                new TWEEN.Tween(particleSystem.scale)
                    .to({ x: 1, y: 1, z: 1 }, 1500)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                // 9. 闪光消散
                setTimeout(() => {
                    flash.style.opacity = 0;

                    new TWEEN.Tween(camera.position)
                        .to({ x: 0, y: 0, z: Math.max(4500, photoCount * 20) }, 1500)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();

                    new TWEEN.Tween(controls)
                        .to({ autoRotateSpeed: 0.6 }, 1500)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();
                }, 400);

            }, 550);
        }

        function updateMenuLabels() {
            const labels = (currentUniverse === 'A')
                ? ["混沌", "星球", "螺旋", "矩阵", "星海"]
                : ["潮汐", "隧道", "双环", "棱锥", "无限"];

            const keyBtns = document.querySelectorAll('.key-btn:not(#btn-reveal)');
            keyBtns.forEach((btn, idx) => {
                const numSpan = btn.querySelector('.num');
                const num = numSpan ? numSpan.outerHTML : `<span class="num">${idx + 1}</span>`;
                btn.innerHTML = `${num} ${labels[idx]}`;
            });

            const revealText = (currentUniverse === 'A') ? "唤醒记忆" : "唤醒回忆";
            document.getElementById('btn-reveal').innerHTML = `<span class="num">0</span> ${revealText}`;
            document.getElementById('status-text').innerText = (currentUniverse === 'A')
                ? "当前状态：星系沉睡中 | 切换形态(1-5) | 按 0 唤醒照片"
                : "当前状态：回忆星河静谧中 | 切换形态(1-5) | 按 0 唤醒共同回忆";
        }

        // ==========================================
        // 照片唤醒 / 隐藏
        // ==========================================
        function executeAwakening() {
            isRevealed = true;
            const layoutMap = (currentUniverse === 'A') ? layoutsA : layoutsB;
            const layoutName = layoutMap[currentShapeId];
            const duration = 3000;

            const stateMessage = (currentUniverse === 'A') ? "照片已唤醒" : "共同回忆已开启";
            document.getElementById('status-text').innerText = `当前状态：${stateMessage} | 鼠标悬浮发光 | 按 0 隐藏`;
            document.getElementById('btn-reveal').innerHTML = '<span class="num">0</span> 隐藏记忆';

            objects.forEach((obj, i) => {
                const elem = obj.element;
                const target = photoTargets[layoutName][i];

                elem.style.pointerEvents = 'auto';
                const cssState = { opacity: 0 };
                new TWEEN.Tween(cssState).to({ opacity: 0.8 }, duration * 0.8)
                    .onUpdate(() => { elem.style.opacity = cssState.opacity; }).start();

                if (currentUniverse === 'A') {
                    if (layoutName === 'scatter') {
                        obj.position.set(0, 0, 0); obj.scale.set(0.01, 0.01, 0.01);
                        tweenObj(obj, target, duration, TWEEN.Easing.Cubic.Out, Math.random() * 1000); pulseParticles(1.5, duration);
                    } else if (layoutName === 'sphere') {
                        obj.position.set(0, -3000, 0); obj.scale.set(0.01, 0.01, 0.01);
                        tweenObj(obj, target, duration, TWEEN.Easing.Elastic.Out, i * 15); pulseParticles(1.4, duration);
                    } else if (layoutName === 'helix') {
                        obj.position.set(0, target.position.y, 0); obj.scale.set(0.1, 0.1, 0.1);
                        tweenObj(obj, target, duration, TWEEN.Easing.Back.Out, i * 20);
                        new TWEEN.Tween(particleSystem.scale).to({ y: 1.6, x: 1.2, z: 1.2 }, duration).easing(TWEEN.Easing.Cubic.InOut).start();
                    } else if (layoutName === 'grid') {
                        obj.position.set(target.position.x, target.position.y + 4000, target.position.z); obj.scale.set(1, 1, 1);
                        tweenObj(obj, target, duration, TWEEN.Easing.Bounce.Out, Math.random() * 1500); pulseParticles(1.3, duration);
                    } else if (layoutName === 'heart') {
                        obj.position.set(target.position.x * 6, target.position.y * 6, target.position.z * 6 + 3000); obj.scale.set(0.01, 0.01, 0.01);
                        tweenObj(obj, target, duration, TWEEN.Easing.Exponential.Out, Math.random() * 1000);
                        new TWEEN.Tween(particleSystem.scale).to({ x: 1.5, y: 1.5, z: 1.5 }, 600).easing(TWEEN.Easing.Quadratic.Out)
                            .onComplete(() => { new TWEEN.Tween(particleSystem.scale).to({ x: 1.15, y: 1.15, z: 1.15 }, 1200).easing(TWEEN.Easing.Cubic.InOut).start(); })
                            .start();
                    }
                } else {
                    if (layoutName === 'wave') {
                        obj.position.set(target.position.x, target.position.y + 3000, target.position.z); obj.scale.set(0.1, 0.1, 0.1);
                        tweenObj(obj, target, duration, TWEEN.Easing.Cubic.Out, i * 8); pulseParticles(1.3, duration);
                    } else if (layoutName === 'tunnel') {
                        obj.position.set(0, target.position.y, 0); obj.scale.set(0.01, 0.01, 0.01);
                        tweenObj(obj, target, duration, TWEEN.Easing.Exponential.Out, i * 12); pulseParticles(1.4, duration);
                    } else if (layoutName === 'rings') {
                        obj.position.set(0, 0, 0); obj.scale.set(0.01, 0.01, 0.01);
                        tweenObj(obj, target, duration, TWEEN.Easing.Elastic.Out, Math.random() * 1200); pulseParticles(1.3, duration);
                    } else if (layoutName === 'pyramid') {
                        obj.position.set(target.position.x, -2000, target.position.z); obj.scale.set(0.1, 0.1, 0.1);
                        tweenObj(obj, target, duration, TWEEN.Easing.Back.Out, i * 15); pulseParticles(1.35, duration);
                    } else if (layoutName === 'infinity') {
                        obj.position.set(target.position.x * 5, target.position.y * 5, target.position.z * 5); obj.scale.set(0.01, 0.01, 0.01);
                        tweenObj(obj, target, duration, TWEEN.Easing.Exponential.Out, Math.random() * 1000);
                        new TWEEN.Tween(particleSystem.scale).to({ x: 1.4, y: 1.4, z: 1.4 }, 600).easing(TWEEN.Easing.Quadratic.Out)
                            .onComplete(() => { new TWEEN.Tween(particleSystem.scale).to({ x: 1.1, y: 1.1, z: 1.1 }, 1200).easing(TWEEN.Easing.Cubic.InOut).start(); })
                            .start();
                    }
                }
            });
        }

        function executeConcealing() {
            isRevealed = false;
            const duration = 2000;

            const revealText = (currentUniverse === 'A') ? "唤醒记忆" : "唤醒回忆";
            document.getElementById('status-text').innerText = (currentUniverse === 'A')
                ? "当前状态：星系沉睡中 | 切换形态(1-5) | 按 0 唤醒照片"
                : "当前状态：回忆星河静谧中 | 切换形态(1-5) | 按 0 唤醒共同回忆";
            document.getElementById('btn-reveal').innerHTML = `<span class="num">0</span> ${revealText}`;

            objects.forEach((obj) => {
                const elem = obj.element;
                elem.style.pointerEvents = 'none';
                const cssState = { opacity: parseFloat(elem.style.opacity) || 0.8 };
                new TWEEN.Tween(cssState).to({ opacity: 0 }, duration * 0.8)
                    .onUpdate(() => { elem.style.opacity = cssState.opacity; }).start();
                new TWEEN.Tween(obj.scale).to({ x: 0.01, y: 0.01, z: 0.01 }, duration).easing(TWEEN.Easing.Cubic.In).start();
            });

            new TWEEN.Tween(particleSystem.scale).to({ x: 1, y: 1, z: 1 }, duration).easing(TWEEN.Easing.Cubic.InOut).start();
        }

        function tweenObj(obj, target, duration, easing, delay) {
            new TWEEN.Tween(obj.position).to({ x: target.position.x, y: target.position.y, z: target.position.z }, duration).easing(easing).delay(delay).start();
            new TWEEN.Tween(obj.rotation).to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, duration).easing(easing).delay(delay).start();
            new TWEEN.Tween(obj.scale).to({ x: 1, y: 1, z: 1 }, duration).easing(easing).delay(delay).start();
        }

        function pulseParticles(scaleTarget, duration) {
            new TWEEN.Tween(particleSystem.scale).to({ x: scaleTarget, y: scaleTarget, z: scaleTarget }, duration).easing(TWEEN.Easing.Cubic.Out).start();
        }

        function transformPhotos(targetsArray, duration, easing = TWEEN.Easing.Exponential.InOut) {
            for (let i = 0; i < objects.length; i++) {
                const obj = objects[i];
                const target = targetsArray[i];
                new TWEEN.Tween(obj.position).to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration).easing(easing).start();
                new TWEEN.Tween(obj.rotation).to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration).easing(easing).start();
            }
            new TWEEN.Tween(camera.position).to({ x: 0, y: 0, z: (targetsArray === photoTargets.heart || targetsArray === photoTargets.infinity ? Math.max(5000, photoCount * 25) : Math.max(4500, photoCount * 20)) }, duration * 1.5).easing(TWEEN.Easing.Cubic.InOut).start();
        }

        function transformParticles(targetArray, duration) {
            particleSource.set(particleSystem.geometry.attributes.position.array);
            activeParticleTarget = targetArray;
            particleTransition.t = 0;

            new TWEEN.Tween(particleTransition).to({ t: 1 }, duration * 1.2).easing(TWEEN.Easing.Exponential.InOut)
                .onUpdate(() => {
                    const pos = particleSystem.geometry.attributes.position.array;
                    const t = particleTransition.t;
                    for (let i = 0; i < particleCount * 3; i++) {
                        pos[i] = particleSource[i] + (activeParticleTarget[i] - particleSource[i]) * t;
                    }
                    particleSystem.geometry.attributes.position.needsUpdate = true;
                }).start();
        }

        function openDetail(index) {
            currentPhotoIndex = index;
            const imgEl = objects[index].element.querySelector('img');

            // 优先已加载高清路径；未就绪则按当前宇宙索引回退
            let highres = imgEl.dataset.highres;
            if (!highres) {
                const folder = currentUniverse === 'A' ? 'image1' : 'image2';
                const total = currentUniverse === 'A' ? TOTAL_LOCAL_IMAGES_A : TOTAL_LOCAL_IMAGES_B;
                const idx = (index % total) + 1;
                highres = `${folder}/${idx}.jpg`;
                const probe = new Image();
                probe.onerror = function () {
                    if (this.src.endsWith('.jpg')) this.src = `${folder}/${idx}.png`;
                };
                probe.src = highres;
            }
            document.getElementById('detail-img').src = highres;

            const totalLogs = currentUniverse === 'A' ? TOTAL_LOCAL_IMAGES_A : TOTAL_LOCAL_IMAGES_B;
            const logData = activeCustomLogs[index % totalLogs];
            let displayTime = logData?.time || `${2020 + (index % 5)}-${String(Math.floor(Math.random() * 12) + 1).padStart(2, '0')}-${String(Math.floor(Math.random() * 28) + 1).padStart(2, '0')}`;
            let displayText = logData?.text || defaultDeeds[index % defaultDeeds.length];

            const totalImages = currentUniverse === 'A' ? TOTAL_LOCAL_IMAGES_A : TOTAL_LOCAL_IMAGES_B;
            document.getElementById('detail-time').innerText = `档案解密：${displayTime} | 记忆坐标: [ ${(index % totalImages) + 1} / ${totalImages} ]`;
            document.getElementById('detail-desc').innerHTML = `
                <p style="color: #fff; font-size: 15px; font-weight: 300; line-height: 1.8;">${displayText}</p>
                <p style="margin-top: 30px; color: #888; font-size: 13px;">—— 我们将这一刻铸入星光，永不磨灭。</p>
            `;
            document.getElementById('detail-modal').classList.add('active');
            controls.autoRotate = false;
        }

        function prevPhoto(e) {
            if (e) e.stopPropagation();
            let n = currentPhotoIndex - 1;
            if (n < 0) n = photoCount - 1;
            openDetail(n);
        }

        function nextPhoto(e) {
            if (e) e.stopPropagation();
            let n = currentPhotoIndex + 1;
            if (n >= photoCount) n = 0;
            openDetail(n);
        }

        function closeDetail() {
            document.getElementById('detail-modal').classList.remove('active');
            controls.autoRotate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            if (webglRenderer) webglRenderer.setSize(window.innerWidth, window.innerHeight);
            if (cssRenderer) cssRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            if (controls) controls.update();

            if (particleSystem) particleSystem.rotation.y += 0.0003;
            if (bgParticleSystem) bgParticleSystem.rotation.y += 0.0001;

            // 流星天气引擎
            const now = Date.now();

            if (now > nextShowerTime && !meteorShowerMode) {
                meteorShowerMode = true;
                showerEndTime = now + random(12000, 18000);
                nextShowerTime = now + random(18000, 25000);

                const statusEl = document.getElementById('status-text');
                statusEl.innerText = "✨ 警告：大规模流星雨正在席卷本记忆星系...";
                statusEl.style.color = "#ff69b4";
                statusEl.style.textShadow = "0 0 15px rgba(255,105,180,0.8)";

                setTimeout(() => {
                    statusEl.style.color = "#888";
                    statusEl.style.textShadow = "none";
                    statusEl.innerText = isRevealed ? "当前状态：照片已唤醒 | 鼠标悬浮发光 | 按 0 隐藏" : "当前状态：星系沉睡中 | 切换形态(1-5) | 按 0 唤醒照片";
                }, 6000);
            }

            if (meteorShowerMode) {
                if (now > showerEndTime) {
                    meteorShowerMode = false;
                } else if (Math.random() < 0.25) {
                    const burstCount = Math.floor(random(4, 9));
                    for (let k = 0; k < burstCount; k++) {
                        meteors.push(new Meteor(webglScene));
                    }
                }
            } else {
                if (now > nextMeteorTime) {
                    const singleCount = Math.floor(random(6, 12));
                    for (let k = 0; k < singleCount; k++) {
                        meteors.push(new Meteor(webglScene));
                    }
                    nextMeteorTime = now + random(2500, 5000);
                }
            }

            meteors = meteors.filter(meteor => {
                meteor.update();
                return meteor.active;
            });

            if (webglRenderer && cssRenderer) {
                webglRenderer.render(webglScene, camera);
                cssRenderer.render(cssScene, camera);
            }
        }

        let isMusicPlaying = false;
        function toggleMusic() {
            const bgMusic = document.getElementById('bg-music');
            const musicBtn = document.getElementById('music-btn');
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.classList.remove('playing');
            } else {
                bgMusic.play().catch(e => console.log("等待用户交互后激活音频播放", e));
                musicBtn.classList.add('playing');
            }
            isMusicPlaying = !isMusicPlaying;
        }

        // === 回忆视频 ===
        let wasMusicPlayingBeforeVideo = false;
        function openVideo() {
            const overlay = document.getElementById('video-overlay');
            const video = document.getElementById('memory-video');
            overlay.classList.add('active');
            controls.autoRotate = false;

            // 暂停背景音乐
            const bgMusic = document.getElementById('bg-music');
            wasMusicPlayingBeforeVideo = isMusicPlaying;
            if (isMusicPlaying) {
                bgMusic.pause();
                document.getElementById('music-btn').classList.remove('playing');
            }

            video.currentTime = 0;
            video.play().catch(e => console.log("视频自动播放需用户交互", e));
        }
        function closeVideo(e) {
            if (e) e.stopPropagation();
            const overlay = document.getElementById('video-overlay');
            const video = document.getElementById('memory-video');
            video.pause();
            overlay.classList.remove('active');
            controls.autoRotate = true;

            // 恢复背景音乐
            if (wasMusicPlayingBeforeVideo) {
                const bgMusic = document.getElementById('bg-music');
                bgMusic.play().catch(e => {});
                document.getElementById('music-btn').classList.add('playing');
            }
        }
        // 点击 overlay 空白区域也可关闭
        document.getElementById('video-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeVideo();
        });
    </script>
</body>
</html>
